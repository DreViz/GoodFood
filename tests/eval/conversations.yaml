- id: C04
  category: booking
  description: Numeric date "18/11" + "table for four" phrasing (=4).
  turns:
    - user: "GoodFoods Patio"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "18/11 at 7pm, table for four"
      expect:
        plan: execute
        action: check_availability
        memory_after: { phase: booking }
    - user: "pat@example.com"
      expect:
        plan: reply
        reply_contains_any: ["confirm", "shall i", "proceed", "book"]
    - user: "yep"
      expect:
        plan: execute
        action: create_reservation
        args_subset:
          customer_email: pat@example.com
