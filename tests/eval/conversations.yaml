    Tests that seating_pref flows into create_reservation args.
  turns:
    - user: "GoodFoods Rooftop"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "tomorrow at 6:30pm for 2"
      expect:
        plan: execute
        action: check_availability
        memory_after: { phase: booking }
    - user: "sky@example.com, outdoor seating please"
      expect:
        plan: reply
        reply_contains_any: ["confirm", "shall i", "proceed"]
    - user: "yes"
