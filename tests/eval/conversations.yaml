# =============================================================================
# Bucket D — Edge cases (9 conversations)
# Robustness / safety: invalid input, hallucination guards, ambiguous matches,
# out-of-scope. These probe the safe_extract_* and strip_memory_if_unsupported
# guards in planner_agent.py.
# =============================================================================

- id: D01
  category: edge
  description: >
    Unavailable time slot. User requests a specific time; check_availability
    should return is_available=false with alternatives. Planner should not
    proceed to booking with an unavailable slot.
  turns:
    - user: "GoodFoods Grill"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "tomorrow at 3:00am for 4"
      expect:
        plan: execute
        action: check_availability
        memory_after: { phase: availability }
  expected_outcome: phase_reached_availability

- id: D02
  category: edge
  description: >
    Invalid email format. User provides a non-email string when asked for an
    email. The safe-extraction path should reject it and re-ask.
  turns:
    - user: "GoodFoods Grill"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "tomorrow at 7:30pm for 4"
      expect:
        plan: execute
        action: check_availability
        memory_after: { phase: booking }
    - user: "my email is notanemail"
      expect:
        plan: reply
        reply_contains_any: ["email", "valid", "which email"]
  expected_outcome: phase_reached_booking

- id: D03
  category: edge
  description: >
    Hallucination guard: party_size=0. safe_extract_party_size rejects 0
    (valid range 1-50). Planner should not store 0; should re-ask.
  turns:
    - user: "GoodFoods Grill"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "tomorrow for 0 people"
      expect:
        plan: reply
        reply_contains_any: ["how many", "guests", "party", "people"]
  expected_outcome: phase_reached_availability

- id: D04
  category: edge
  description: >
    Hallucination guard: negative party size. Should be rejected just like 0.
  turns:
    - user: "GoodFoods Grill"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "tomorrow for -3 people"
      expect:
        plan: reply
        reply_contains_any: ["how many", "guests", "party", "people"]
  expected_outcome: phase_reached_availability

- id: D05
  category: edge
  description: >
    Ambiguous restaurant name. "GoodFoods" matches all 50 venues. The fuzzy
    resolver picks the first ilike match; behavior is non-deterministic but
    should NOT crash. Documented finding either way.
  turns:
    - user: "GoodFoods"
      expect:
        plan: execute
        action: get_seating_labels
  expected_outcome: phase_reached_availability

- id: D06
  category: edge
  description: Out-of-scope question at Phase 1. Failsafe reply, no tool call.
  turns:
    - user: "what's the weather today"
      expect:
        plan: reply
        reply_contains_any: ["clarify", "food", "dine", "restaurant", "reservation"]
  expected_outcome: no_action

- id: D07
  category: edge
  description: >
    Restaurant not in DB. Search returns empty; agent should not crash and
    should communicate the empty result or suggest alternatives.
  turns:
    - user: "FakeFoods Place"
      expect:
        plan: execute
        action: get_seating_labels
  expected_outcome: no_action

- id: D08
  category: edge
  description: >
    Mid-conversation context switch: user changes party size after already
    providing it. Memory should update to the new value, not retain the old.
  turns:
    - user: "GoodFoods Grill"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "tomorrow at 7:30pm for 4"
      expect:
        plan: execute
        action: check_availability
        memory_after: { phase: booking, party_size: 4 }
    - user: "actually make it 6 people"
      expect:
        plan: reply
  expected_outcome: phase_reached_booking

- id: D09
  category: edge
  description: >
    Ambiguous time: user offers two times in one message. Behavior is
    non-deterministic; planner should either ask for clarification or pick
    one. Documented finding.
  turns:
    - user: "GoodFoods Grill"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "tomorrow at 7 or 8pm for 4"
      expect:
        plan: reply
  expected_outcome: phase_reached_availability


# =============================================================================
# Bucket E — Cancel / Modify flows (9 conversations)
# Each case seeds a confirmed reservation so cancel/modify have something to
# operate on. Uses the `seed.reservation` field; the runner inserts the row
# before turn 1.
# =============================================================================

- id: E01
  category: cancel_modify
  description: Cancel happy path. Seeded reservation gets soft-deleted.
  seed:
    reservation:
      customer_email: cancel@example.com
      restaurant: GoodFoods Grill
      date: "2025-12-01"
      time: "19:30"
      party_size: 4
  turns:
    - user: "cancel my booking"
      expect:
        plan: reply
        reply_contains_any: ["email", "which email"]
    - user: "cancel@example.com"
      expect:
        plan: execute
        action: get_booking_details
        args_subset:
          customer_email: cancel@example.com
    - user: "yes cancel it"
      expect:
        plan: execute
        action: cancel_reservation
        args_subset:
          customer_email: cancel@example.com
  expected_outcome: booking_cancelled

- id: E02
  category: cancel_modify
  description: >
    Modify time happy path. Seeded reservation's time changes; modify_reservation
    re-validates the new slot via get_available_slots.
  seed:
    reservation:
      customer_email: modify@example.com
      restaurant: GoodFoods Grill
      date: "2025-12-01"
      time: "19:30"
      party_size: 2
  turns:
    - user: "modify my reservation"
      expect:
        plan: reply
        reply_contains_any: ["email", "which email"]
    - user: "modify@example.com"
      expect:
        plan: execute
        action: get_booking_details
    - user: "change the time to 20:00"
      expect:
        plan: execute
        action: modify_reservation
        args_subset:
          customer_email: modify@example.com
          new_time: "20:00"
  expected_outcome: booking_modified

- id: E03
  category: cancel_modify
  description: Cancel with email already supplied in turn 1 (no clarifying reply).
  seed:
    reservation:
      customer_email: inline@example.com
      restaurant: GoodFoods Bistro
      date: "2025-12-02"
      time: "20:00"
      party_size: 3
  turns:
    - user: "cancel booking for inline@example.com"
      expect:
        plan: execute
