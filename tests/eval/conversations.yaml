    - user: "GoodFoods Hall"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "next monday at 7:30pm, party of 8"
      expect:
        plan: execute
        action: check_availability
        memory_after: { phase: booking }
    - user: "group@example.com"
      expect:
