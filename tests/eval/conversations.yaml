# =============================================================================
# GoodFoods Evaluation Test Set
# =============================================================================
# Consumed by scripts/evaluate.py. Each top-level item is one conversation.
# The runner resets conversation memory before each conversation and calls
# POST /agent/chat turn-by-turn.
#
# PER-TURN EXPECTATION SCHEMA (fields under `expect`)
#   plan                : "reply" | "execute"            (required)
#   action              : <tool name>                    (required if plan=execute)
#   args_subset         : { key: value, ... }            (optional; case-insensitive
#                                                          match on string values.
#                                                          Only the listed keys are
#                                                          checked; extra keys ignored.)
#   reply_contains_any  : [substr, ...]                  (optional if plan=reply;
#                                                          pass if reply contains at
#                                                          least one, case-insensitive)
#   memory_after        : { key: value, ... }            (optional; checked against
#                                                          conversation memory after
#                                                          this turn completes)
#
# PER-CONVERSATION FIELDS
#   id, category, description, turns, expected_outcome
#   seed (optional)        : pre-conversation DB seed. Currently supports a single
#                            reservation under `seed.reservation`. The runner inserts
#                            it before the first turn so cancel/modify cases have
#                            something to operate on.
#
# expected_outcome VALUES
#   no_action                  : conversation ends in replies/searches only
#   phase_reached_availability : memory.phase == availability at end
#   phase_reached_booking      : memory.phase == booking at end
#   booking_created            : a Reservation row landed in the DB
#   booking_cancelled          : seeded reservation status -> cancelled
#   booking_modified           : seeded reservation fields changed
#   error_presented            : agent surfaced an error message to the user
#
# DATA NOTES (affect realism of cases)
#   - Zones are cardinal: South, East, West, North, Central, North-East,
#     North-West, South-East, Central-East, Far South. NOT neighborhoods.
#   - All restaurants are branded "GoodFoods <X>".
#   - Cuisines present: Italian, Pan-Asian, North Indian, South Indian, BBQ,
#     Tex-Mex, Mediterranean, European, American, Chinese, Mughlai, Andhra.
# =============================================================================


# =============================================================================
# Bucket A — Search / Discovery (9 conversations)
# =============================================================================

- id: A01
  category: search
  description: >
    Cuisine-only triggers a clarifying reply, NOT a search.
    Phase-1 prompt rule (lines 82-83): cuisine + no other filter -> ask the
    user for additional preferences.
  turns:
    - user: "I'm in the mood for Italian"
      expect:
        plan: reply
        reply_contains_any: ["preferences", "area", "budget", "rating", "tag", "other", "cuisine"]
  expected_outcome: no_action

- id: A02
  category: search
  description: Cuisine + zone triggers a filtered search with both args.
  turns:
    - user: "Any Italian places in South?"
      expect:
        plan: execute
        action: search_restaurants_by_filters
        args_subset:
          cuisine: italian
          zone: south
  expected_outcome: no_action

- id: A03
  category: search
  description: >
    Budget phrase normalization ("under 1000" -> max_price=1000 int) plus
    Asian-synonym handling ("asian food" -> cuisine "Asian").
  turns:
    - user: "Asian food under 1000"
      expect:
        plan: execute
        action: search_restaurants_by_filters
        args_subset:
          cuisine: asian
          max_price: 1000
  expected_outcome: no_action

- id: A04
  category: search
  description: >
    Multi-turn discovery. Turn 1 cuisine-only -> clarifying reply. Turn 2 adds
    zone -> filtered search. Validates Phase 1 holds context across turns.
  turns:
    - user: "I want Italian"
      expect:
        plan: reply
        reply_contains_any: ["preferences", "area", "budget", "other", "rating"]
    - user: "In South"
      expect:
        plan: execute
        action: search_restaurants_by_filters
        args_subset:
          cuisine: italian
          zone: south
  expected_outcome: no_action

- id: A05
  category: search
  description: >
    Tag extraction with synonym. Phase-1 prompt maps "terrace / patio" ->
    tag "outdoor seating". User says "terrace", agent emits tag="outdoor seating".
  turns:
    - user: "terrace dining in West"
      expect:
        plan: execute
        action: search_restaurants_by_filters
        args_subset:
          zone: west
          tag: outdoor seating
  expected_outcome: no_action

- id: A06
  category: search
  description: Suggestion request with no filters -> recommend_venues with empty args.
  turns:
    - user: "Any recommendations?"
      expect:
        plan: execute
        action: recommend_venues
        args_subset: {}
  expected_outcome: no_action

- id: A07
  category: search
  description: >
    User names a specific restaurant -> get_seating_labels + phase transition
    discovery -> availability. The most important Phase-1 transition.
  turns:
    - user: "GoodFoods Grill"
      expect:
        plan: execute
        action: get_seating_labels
        args_subset:
          restaurant: goodfoods grill
        memory_after: { phase: availability }
  expected_outcome: phase_reached_availability

- id: A08
  category: search
  description: Ambiguous message -> failsafe clarifying reply.
  turns:
    - user: "I want food"
      expect:
        plan: reply
        reply_contains_any: ["clarify", "what", "cuisine", "area", "where"]
  expected_outcome: no_action

- id: A09
  category: search
  description: >
    Ambiguous zone ("near me") + cuisine. Phase-1 synonyms section says
    "near me/around here" should trigger a clarifying question, NOT a search.
    Models vary; a search-with-zone-near-me result is a documented finding.
  turns:
    - user: "Italian near me"
      expect:
        plan: reply
        reply_contains_any: ["area", "which", "where", "zone"]
  expected_outcome: no_action


# =============================================================================
# Bucket B — Availability (9 conversations)
# Phase 2 logic. Each case enters Phase 2 via turn 1 (naming a restaurant),
# then exercises Phase 2 collection rules: date formats, party-size phrasings,
# time handling, seating-label requests, and the Phase 2 -> 3 transition.
# =============================================================================

- id: B01
  category: availability
  description: >
    Standard Phase 2 flow: restaurant + date + party_size in one turn, no time.
    Planner should call check_availability with time absent/null; phase stays
    availability (auto-transition to booking only fires when time is present).
  turns:
    - user: "GoodFoods Grill"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "18 Nov for 4 people"
      expect:
        plan: execute
        action: check_availability
        args_subset:
          party_size: 4
        memory_after: { phase: availability }
  expected_outcome: phase_reached_availability

- id: B02
  category: availability
  description: >
    "tomorrow" date format + "table for two" party-size phrasing (=2).
  turns:
    - user: "GoodFoods Bistro"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "table for two tomorrow"
      expect:
        plan: execute
        action: check_availability
        args_subset:
          party_size: 2
  expected_outcome: phase_reached_availability

- id: B03
  category: availability
  description: >
    "we are 5" party-size phrasing + "this friday" natural date.
  turns:
    - user: "GoodFoods Garden"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "we are 5 people this friday"
      expect:
        plan: execute
        action: check_availability
        args_subset:
          party_size: 5
  expected_outcome: phase_reached_availability

- id: B04
  category: availability
  description: >
    Multi-turn Phase 2: restaurant + party_size but no date -> reply asking
    for the date (Phase 2 collection order: date is first).
  turns:
    - user: "GoodFoods Patio"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "for 3 people"
      expect:
        plan: reply
        reply_contains_any: ["date", "which day", "what day"]
  expected_outcome: phase_reached_availability

- id: B05
  category: availability
  description: >
    Multi-turn Phase 2: restaurant + date but no party_size -> reply asking
    for party size.
  turns:
    - user: "GoodFoods Taproom"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "tomorrow"
      expect:
        plan: reply
        reply_contains_any: ["how many", "guests", "party", "people"]
  expected_outcome: phase_reached_availability

- id: B06
  category: availability
  description: >
    Full Phase 2 with time specified -> check_availability with time, then
    auto-transition to booking. Ends one step from create_reservation.
  turns:
    - user: "GoodFoods Grill"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "tomorrow at 7:30pm for 4"
      expect:
        plan: execute
        action: check_availability
        args_subset:
          party_size: 4
        memory_after: { phase: booking }
  expected_outcome: phase_reached_booking

- id: B07
  category: availability
  description: >
    User asks to see seating options mid-Phase-2. Phase-2 prompt has an
    explicit rule for "show/list seating" -> get_seating_labels with the
    memory restaurant.
  turns:
    - user: "GoodFoods Grill"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "show seating options"
      expect:
        plan: execute
        action: get_seating_labels
        args_subset:
          restaurant: goodfoods grill
  expected_outcome: phase_reached_availability

- id: B08
  category: availability
  description: >
    Phase 2 -> 3 transition via slot pick with email MISSING. Phase-2 prompt
    says reply "Which email should I use" rather than executing create_reservation.
  turns:
    - user: "GoodFoods Grill"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "tomorrow at 7:30pm for 4"
      expect:
        plan: execute
        action: check_availability
        memory_after: { phase: booking }
    - user: "7:30pm works for me"
      expect:
        plan: reply
        reply_contains_any: ["email", "which email"]
  expected_outcome: phase_reached_booking

- id: B09
  category: availability
  description: >
    Out-of-scope input mid-Phase-2. Phase-2 prompt says IGNORE discovery /
    recommendations; the failsafe reply asks for date or party size.
  turns:
    - user: "GoodFoods Grill"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "what's the weather like"
      expect:
        plan: reply
        reply_contains_any: ["date", "party", "guests", "clarify", "how many"]
  expected_outcome: phase_reached_availability


# =============================================================================
# Bucket C — Booking completion (9 conversations)
# End-to-end happy paths that should result in a real Reservation row.
# Standard 4-turn shape: name restaurant -> date+time+party -> email -> confirm.
# Variations cover input-format robustness (date formats, party phrasings,
# confirmation phrasings, seating preference inclusion).
# =============================================================================

- id: C01
  category: booking
  description: Baseline happy path. "tomorrow" date, numeric party, "yes" confirm.
  turns:
    - user: "GoodFoods Grill"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "tomorrow at 7:30pm for 4 people"
      expect:
        plan: execute
        action: check_availability
        memory_after: { phase: booking }
    - user: "john@example.com"
      expect:
        plan: reply
        reply_contains_any: ["confirm", "shall i", "proceed", "book"]
    - user: "yes"
      expect:
        plan: execute
        action: create_reservation
        args_subset:
          customer_email: john@example.com
          party_size: 4
  expected_outcome: booking_created

- id: C02
  category: booking
  description: Happy path with explicit seating preference included with email.
  turns:
    - user: "GoodFoods Bistro"
      expect:
        plan: execute
        action: get_seating_labels
        memory_after: { phase: availability }
    - user: "tomorrow at 8pm for 2"
      expect:
        plan: execute
        action: check_availability
        memory_after: { phase: booking }
    - user: "jane@example.com, indoor seating"
      expect:
        plan: reply
        reply_contains_any: ["confirm", "shall i", "proceed", "book"]
    - user: "yes go ahead"
      expect:
        plan: execute
        action: create_reservation
        args_subset:
          customer_email: jane@example.com
